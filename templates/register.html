<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AuthWarden Register</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f7f6;
        color: #17201c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        background: #ffffff;
        border: 1px solid #d8e0dc;
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 18px 45px rgba(23, 32, 28, 0.08);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.15;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 24px;
        color: #50645c;
        line-height: 1.5;
      }

      form,
      .oauth-actions {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 14px;
        font-weight: 650;
      }

      input {
        width: 100%;
        min-height: 44px;
        border: 1px solid #b8c5bf;
        border-radius: 6px;
        padding: 10px 12px;
        font: inherit;
      }

      button,
      .button {
        min-height: 44px;
        border: 1px solid #17201c;
        border-radius: 6px;
        padding: 10px 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #17201c;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      .button.secondary {
        background: #ffffff;
        color: #17201c;
        border-color: #b8c5bf;
      }

      .provider-icon {
        width: 18px;
        height: 18px;
        flex: 0 0 18px;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 22px 0;
        color: #6c7c76;
        font-size: 13px;
      }

      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        flex: 1;
        background: #d8e0dc;
      }

      .footer-link {
        margin: 20px 0 0;
        font-size: 14px;
        text-align: center;
      }

      a {
        color: #1f6f55;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Create your AuthWarden account</h1>
      <p>Register with email and password or start with an OAuth provider.</p>

      <form method="post" action="/register">
        <label>
          Email
          <input name="email" type="email" autocomplete="email" required>
        </label>

        <label>
          Password
          <input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        </label>

        <button type="submit">Create account</button>
      </form>

      <div class="divider">or</div>

      <div class="oauth-actions">
        <a class="button secondary" href="/auth/github">
          <svg class="provider-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path fill="currentColor" d="M8 0C3.58 0 0 3.64 0 8.13c0 3.59 2.29 6.63 5.47 7.71.4.08.55-.18.55-.39 0-.19-.01-.83-.01-1.5-2.01.38-2.53-.5-2.69-.96-.09-.24-.48-.96-.82-1.15-.28-.15-.68-.52-.01-.53.63-.01 1.08.59 1.23.83.72 1.23 1.87.88 2.33.67.07-.53.28-.88.51-1.09-1.78-.21-3.64-.91-3.64-4.02 0-.89.31-1.62.82-2.19-.08-.2-.36-1.03.08-2.16 0 0 .67-.22 2.2.84A7.43 7.43 0 0 1 8 3.92c.68 0 1.36.09 2 .27 1.53-1.06 2.2-.84 2.2-.84.44 1.13.16 1.96.08 2.16.51.57.82 1.3.82 2.19 0 3.12-1.87 3.81-3.65 4.02.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.47.55.39A8.13 8.13 0 0 0 16 8.13C16 3.64 12.42 0 8 0Z"/>
          </svg>
          Continue with GitHub
        </a>
        <a class="button secondary" href="/auth/google">
          <svg class="provider-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285f4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.19 3.32v2.76h3.55c2.08-1.91 3.28-4.74 3.28-8.09Z"/>
            <path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.55-2.76c-.98.66-2.23 1.06-3.73 1.06-2.87 0-5.29-1.94-6.16-4.53H2.18v2.85A11 11 0 0 0 12 23Z"/>
            <path fill="#fbbc05" d="M5.84 14.11a6.61 6.61 0 0 1 0-4.22V7.04H2.18a11 11 0 0 0 0 9.92l3.66-2.85Z"/>
            <path fill="#ea4335" d="M12 5.36c1.62 0 3.07.56 4.21 1.65l3.15-3.15A10.53 10.53 0 0 0 12 1 11 11 0 0 0 2.18 7.04l3.66 2.85C6.71 7.3 9.13 5.36 12 5.36Z"/>
          </svg>
          Continue with Google
        </a>
      </div>

      <p class="footer-link">Already have an account? <a href="/login">Sign in</a></p>
    </main>
  </body>
</html>
